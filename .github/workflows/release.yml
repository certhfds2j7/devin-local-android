name: Signed release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  signing-configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check optional cloud signing configuration
        env:
          SIGNING_READY: ${{ secrets.DEVIN_KEYSTORE_BASE64 != '' && secrets.DEVIN_STORE_PASSWORD != '' && secrets.DEVIN_KEY_PASSWORD != '' }}
        run: |
          echo "ready=$SIGNING_READY" >> "$GITHUB_OUTPUT"
          if [ "$SIGNING_READY" != "true" ]; then
            echo '### Cloud signing is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'Signed builds are skipped. Locally signed, verified APKs can be published without uploading the private key.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: signing-configuration
    if: needs.signing-configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run build
        working-directory: web
      - run: python3 tools/bundle-runtime.py
      - run: python3 -m pip install -r tests/requirements.txt && python3 -m unittest discover -s tests -v
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore private signing identity
        env:
          KEYSTORE: ${{ secrets.DEVIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Release signing secret is missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/devin-release.p12"
      - name: Build signed APK
        env:
          DEVIN_STORE_FILE: ${{ runner.temp }}/devin-release.p12
          DEVIN_STORE_PASSWORD: ${{ secrets.DEVIN_STORE_PASSWORD }}
          DEVIN_KEY_PASSWORD: ${{ secrets.DEVIN_KEY_PASSWORD }}
          DEVIN_KEY_ALIAS: devinlocal
        run: bash ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --console=plain
      - name: Verify release identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-cert.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          expected = Path("docs/release-signing-cert.sha256").read_text().strip().lower()
          actual = re.search(r"certificate SHA-256 digest: ([0-9a-f]+)", (Path(os.environ["RUNNER_TEMP"])/"apk-cert.txt").read_text())[1]
          assert actual == expected, "Unexpected release signer"
          PY
      - run: python3 tools/release-metadata.py --apk app/build/outputs/apk/release/app-release.apk --output dist --tag "$GITHUB_REF_NAME"
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Devin 本地助手 $GITHUB_REF_NAME（非官方）" --notes-file docs/release-notes.md
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/devin-release.p12"
